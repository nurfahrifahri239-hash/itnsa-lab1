<style>

</style></head><body><div id="app"></div><script>
const Z='lab-tkj.smkn22.sch.id',RZ='22.168.192.in-addr.arpa',$=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const e=s=>new RegExp('^'+s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'$','i');
let S={done:{},hist:[],exams:[],fs:13};try{S=Object.assign(S,JSON.parse(localStorage.getItem('itnsa')||'{}'))}catch(_){}
const save=()=>{try{localStorage.setItem('itnsa',JSON.stringify(S))}catch(_){}};
const LV=['','Beginner','Intermediate','Advanced'],LC=['','#34d399','#22d3ee','#ef4444'];
const lb=l=>`<span class=lb style="color:${LC[l]}">${LV[l]}</span>`;

/* ---------- PARSERS ---------- */
const TY='SOA NS A AAAA CNAME MX PTR TXT SRV CAA'.split(' ');
function zp(t,org){let o=org+'.',ttl=0,recs=[],errs=[],last='@',L=[],buf='',st=0,d=0;
 const sec=x=>{const m=String(x).match(/^(\d+)([smhdw]?)$/i);return m?+m[1]*({s:1,m:60,h:3600,d:86400,w:604800}[(m[2]||'s').toLowerCase()]):NaN};
 const fq=x=>x=='@'?o:x.endsWith('.')?x.toLowerCase():(x+'.'+o).toLowerCase();
 t.split('\n').forEach((ln,i)=>{const l=ln.replace(/;.*/,'');if(!buf)st=i+1;buf+=(buf?' ':'')+(d>0?l.trim():l);for(const c of l){if(c=='(')d++;if(c==')')d--}if(d<=0){if(buf.trim())L.push([st,buf]);buf='';d=0}});
 if(d>0)errs.push([st,'Tanda kurung SOA tidak ditutup ")"']);
 for(const[n,s0]of L){const s=s0.replace(/[()]/g,' '),tk=s.trim().split(/\s+/);
  if(/^\$TTL$/i.test(tk[0])){ttl=sec(tk[1]);if(isNaN(ttl))errs.push([n,'Nilai $TTL tidak valid']);continue}
  if(/^\$ORIGIN$/i.test(tk[0])){o=tk[1].endsWith('.')?tk[1]:tk[1]+'.';continue}
  const nm=/^\s/.test(s)?last:tk.shift();last=nm;let rt=null;
  while(tk.length&&(/^\d+[smhdw]?$/i.test(tk[0])||/^in$/i.test(tk[0]))){if(!/^in$/i.test(tk[0]))rt=sec(tk[0]);tk.shift()}
  const ty=(tk.shift()||'').toUpperCase();
  if(!TY.includes(ty)){errs.push([n,'Tipe record tidak dikenal/hilang: "'+(ty||'-')+'"']);continue}
  let rd=tk.join(' ');
  if(['NS','CNAME','PTR'].includes(ty))rd=fq(tk[0]||'');
  else if(ty=='MX'){if(tk.length!=2||isNaN(tk[0]))errs.push([n,'MX harus: prioritas hostname']);rd=tk[0]+' '+fq(tk[1]||'')}
  else if(ty=='SOA'&&tk.length!=7)errs.push([n,'SOA butuh 7 field (mname rname serial refresh retry expire minimum), ditemukan '+tk.length]);
  else if(ty=='A'&&!/^(\d{1,3}\.){3}\d{1,3}$/.test(rd))errs.push([n,'Alamat IPv4 tidak valid: '+rd]);
  else if(ty=='AAAA'&&!/^[0-9a-f:]+$/i.test(rd))errs.push([n,'Alamat IPv6 tidak valid']);
  recs.push({n,name:fq(nm),ty,rd,tk,ttl:rt})}
 const so=recs.find(r=>r.ty=='SOA');
 return{errs,ttl,recs,h:(ty,nm,rx)=>recs.some(r=>r.ty==ty&&(nm==null||r.name==fq(nm))&&(!rx||rx.test(r.rd))),
  soaok:!!so&&so.tk.length==7&&/^\d{10}$/.test(so.tk[2])&&so.tk.slice(3).every(x=>!isNaN(sec(x)))}}
function cf(t,kind){const errs=[];let d=0;const ls=t.split('\n').map(l=>l.replace(kind=='bind'?/\/\/.*|#.*/:/#.*/,'')),st=[];
 ls.forEach((l,i)=>{const x=l.trim();if(!x)return;
  if(kind=='apache'){let m;if(m=x.match(/^<\/(\w+)\s*>$/)){const p=st.pop();if(!p||p[0].toLowerCase()!=m[1].toLowerCase())errs.push([i+1,'Tag penutup </'+m[1]+'> tidak cocok'])}else if(m=x.match(/^<(\w+)[^>]*>$/))st.push([m[1],i+1]);else if(x[0]=='<')errs.push([i+1,'Tag tidak valid'])}
  else{for(const c of x){if(c=='{')d++;if(c=='}')d--}if(['bind','dhcp'].includes(kind)&&!/[;{}]$/.test(x))errs.push([i+1,'Baris tidak diakhiri ";"'])}});
 if(kind=='apache')st.forEach(p=>errs.push([p[1],'Tag <'+p[0]+'> tidak ditutup']));else if(d)errs.push([0,'Kurung { } tidak seimbang']);
 return{errs,n:ls.join('\n').replace(/\s+/g,' ').trim()}}
function cc(t){const lines=t.split('\n').map(l=>l.trim().replace(/\s+/g,' ').toLowerCase()).filter(l=>l&&l[0]!='!'),B=[];let cur=null;
 const HD=/^(interface |line |router |vlan \d+$|ip dhcp pool )/,TOP=/^(hostname|enable|ip route|ip domain|username|crypto|service|spanning-tree|vtp|ip ssh|ip dhcp excluded|banner|no ip)/;
 for(const l of lines){if(HD.test(l)){cur=[l,[]];B.push(cur)}else if(l=='exit'||l=='end')cur=null;else if(cur&&!TOP.test(l))cur[1].push(l);else cur=null}
 return{errs:[],g:r=>lines.some(l=>r.test(l)),b:(h,...bs)=>B.some(([x,bd])=>h.test(x)&&bs.every(r=>bd.some(l=>r.test(l))))}}

/* ---------- EXERCISES ---------- */
const ZH=`$TTL 86400\n$ORIGIN ${Z}.\n@ IN SOA ns1.${Z}. admin.${Z}. (\n  2026110201 ; serial\n  3600 ; refresh\n  1800 ; retry\n  604800 ; expire\n  86400 ) ; negative cache TTL\n@ IN NS ns1.${Z}.\nns1 IN A 192.168.22.2\n`;
const SOA=`@ IN SOA ns1.${Z}. admin.${Z}. (\n  2026110201 3600 1800 604800 86400 )`;
const ZR=[[12,'Sintaks zone valid','Periksa tipe record, jumlah field, dan kurung SOA',c=>!c.errs.length],
[14,'SOA lengkap: 7 field, serial 10 digit (YYYYMMDDNN)',SOA,c=>c.soaok],
[8,'$TTL 86400 terdefinisi','$TTL 86400',c=>c.ttl==86400],
[8,'Ada record NS untuk zone',`@ IN NS ns1.${Z}.`,c=>c.h('NS','@')]];
const zx=(id,lv,t,q,ex,hint,sol,o=Z,st=ZH)=>({id,m:'dns',lv,t,q,k:'zone',o,st,rules:[...ZR,...ex],hint,sol});
const RH=`$TTL 86400\n$ORIGIN ${RZ}.\n`,CS=[10,'Sintaks (titik koma / kurung) valid','Akhiri tiap statement dengan ";" dan seimbangkan { }',c=>!c.errs.length];
const rx=(pts,msg,fix,re)=>[pts,msg,fix,c=>re.test(c.n)];
const EX=[
zx('d1',1,'Record A: www','Tambahkan record A untuk host <code>www</code> dengan IP 192.168.22.10 pada zone di bawah.',[[40,'A www → 192.168.22.10','www IN A 192.168.22.10',c=>c.h('A','www',e('192.168.22.10'))]],'Format: nama [TTL] IN A alamat-ip','www IN A 192.168.22.10'),
zx('d2',2,'SOA, TTL & NS dari nol',`Ketik zone lengkap untuk ${Z}: $TTL 86400, SOA (primary ns1, admin admin, serial YYYYMMDDNN), NS, dan A record ns1 = 192.168.22.2.`,[[25,'A ns1 → 192.168.22.2','ns1 IN A 192.168.22.2',c=>c.h('A','ns1',e('192.168.22.2'))],[15,'NS menunjuk ns1',`@ IN NS ns1.${Z}.`,c=>c.h('NS','@',e('ns1.'+Z+'.'))],[10,'SOA primary = ns1',SOA,c=>c.h('SOA','@',new RegExp('^ns1\\.'+Z.replace(/\./g,'\\.')+'\\. ','i'))]],'Urutan: $TTL, $ORIGIN (opsional), SOA, NS, A. SOA ditutup ")".',ZH,Z,'; ketik zone di sini\n'),
zx('d3',2,'Record MX priority 10','Tambahkan MX untuk domain dengan priority 10 ke host <code>mail</code>, serta A record mail = 192.168.22.20.',[[25,'MX @ → 10 mail',`@ IN MX 10 mail.${Z}.`,c=>c.h('MX','@',e('10 mail.'+Z+'.'))],[20,'A mail → 192.168.22.20','mail IN A 192.168.22.20',c=>c.h('A','mail',e('192.168.22.20'))]],'MX: @ IN MX prioritas target. Target harus punya record A.',ZH+`@ IN MX 10 mail\nmail IN A 192.168.22.20\n`),
zx('d4',2,'Reverse zone & PTR','Buat reverse zone 22.168.192.in-addr.arpa: SOA, NS ns1, PTR untuk 192.168.22.10 → www dan 192.168.22.2 → ns1.',[[25,'PTR 10 → www',`10 IN PTR www.${Z}.`,c=>c.h('PTR','10',e('www.'+Z+'.'))],[20,'PTR 2 → ns1',`2 IN PTR ns1.${Z}.`,c=>c.h('PTR','2',e('ns1.'+Z+'.'))]],'Di reverse zone hanya oktet terakhir yang ditulis; target PTR harus FQDN berakhiran titik.',`$TTL 86400\n@ IN SOA ns1.${Z}. admin.${Z}. (\n  2026110201 3600 1800 604800 86400 )\n@ IN NS ns1.${Z}.\n2 IN PTR ns1.${Z}.\n10 IN PTR www.${Z}.\n`,RZ,RH),
zx('d5',2,'AAAA, CNAME & TXT','Tambahkan: AAAA untuk www = 2001:db8:22::10, CNAME web → www, dan TXT SPF "v=spf1 mx -all" untuk domain.',[[15,'AAAA www',`www IN AAAA 2001:db8:22::10`,c=>c.h('AAAA','www',e('2001:db8:22::10'))],[15,'CNAME web → www',`web IN CNAME www`,c=>c.h('CNAME','web',e('www.'+Z+'.'))],[15,'TXT SPF','@ IN TXT "v=spf1 mx -all"',c=>c.h('TXT','@',/"v=spf1 mx -all"/i)]],'Teks TXT harus dalam tanda kutip. CNAME tidak boleh berdampingan dengan record lain di nama yang sama.',ZH+`www IN A 192.168.22.10\nwww IN AAAA 2001:db8:22::10\nweb IN CNAME www\n@ IN TXT "v=spf1 mx -all"\n`),
{id:'d6',m:'dns',lv:1,t:'named.conf (include)',q:'Ketik <code>/etc/bind/named.conf</code> yang meng-include named.conf.options, named.conf.local, dan named.conf.default-zones dari /etc/bind.',k:'conf',kind:'bind',st:'// /etc/bind/named.conf\n',rules:[CS,...['options','local','default-zones'].map(n=>rx(30,'include named.conf.'+n,`include "/etc/bind/named.conf.${n}";`,new RegExp('include\\s*"/etc/bind/named\\.conf\\.'+n.replace('-','\\-')+'"\\s*;','i')))],hint:'include "path"; — satu baris per file.',sol:'include "/etc/bind/named.conf.options";\ninclude "/etc/bind/named.conf.local";\ninclude "/etc/bind/named.conf.default-zones";\n'},
{id:'d7',m:'dns',lv:2,t:'named.conf.local (zone)',q:`Deklarasikan zone master (primary) forward ${Z} dan reverse ${RZ}. File di /etc/bind/.`,k:'conf',kind:'bind',st:'// /etc/bind/named.conf.local\n',rules:[CS,rx(25,'Forward zone primary + file','zone "'+Z+'" { type primary; file "/etc/bind/db.lab-tkj"; };',/zone\s*"lab-tkj\.smkn22\.sch\.id"\s*(in\s*)?\{[^}]*type\s+(primary|master)\s*;[^}]*file\s+"\/etc\/bind\/[^"]+"\s*;[^}]*\}\s*;/i),rx(25,'Reverse zone primary + file','zone "'+RZ+'" { type primary; file "/etc/bind/db.192"; };',/zone\s*"22\.168\.192\.in-addr\.arpa"\s*(in\s*)?\{[^}]*type\s+(primary|master)\s*;[^}]*file\s+"\/etc\/bind\/[^"]+"\s*;[^}]*\}\s*;/i)],hint:'BIND 9.20 memakai "type primary;" ("master" masih diterima sebagai alias lama).',sol:`zone "${Z}" {\n  type primary;\n  file "/etc/bind/db.lab-tkj";\n};\nzone "${RZ}" {\n  type primary;\n  file "/etc/bind/db.192";\n};\n`},
{id:'d8',m:'dns',lv:2,t:'named.conf.options',q:'Konfigurasi options: directory /var/cache/bind, forwarders 8.8.8.8 & 1.1.1.1, allow-query untuk 192.168.22.0/24, recursion yes, dnssec-validation auto.',k:'conf',kind:'bind',st:'// /etc/bind/named.conf.options\n',rules:[CS,rx(10,'directory "/var/cache/bind"','directory "/var/cache/bind";',/options\s*\{[^}]*directory\s+"\/var\/cache\/bind"\s*;/i),rx(15,'forwarders 8.8.8.8','forwarders { 8.8.8.8; 1.1.1.1; };',/forwarders\s*\{[^}]*\b8\.8\.8\.8\s*;/),rx(15,'forwarders 1.1.1.1','forwarders { 8.8.8.8; 1.1.1.1; };',/forwarders\s*\{[^}]*\b1\.1\.1\.1\s*;/),rx(15,'allow-query mencakup 192.168.22.0/24','allow-query { 192.168.22.0/24; localhost; };',/allow-query\s*\{[^}]*192\.168\.22\.0\/24\s*;/),rx(10,'recursion yes','recursion yes;',/recursion\s+yes\s*;/),rx(10,'dnssec-validation auto','dnssec-validation auto;',/dnssec-validation\s+auto\s*;/),rx(10,'Tanpa dnssec-enable/lookaside (dihapus di BIND 9.18+)','Hapus baris dnssec-enable / dnssec-lookaside',/^(?!.*dnssec-(enable|lookaside))/)],hint:'forwarders { ip; ip; }; — setiap IP diakhiri titik koma.',sol:'options {\n  directory "/var/cache/bind";\n  forwarders { 8.8.8.8; 1.1.1.1; };\n  allow-query { 192.168.22.0/24; localhost; };\n  recursion yes;\n  dnssec-validation auto;\n  listen-on { 192.168.22.2; };\n  listen-on-v6 { any; };\n};\n'},
zx('d9',3,'DNS Challenge: zone lengkap',`Skenario: domain ${Z}, DNS server 192.168.22.2 (ns1), client www 192.168.22.10. Ketik zone lengkap: SOA, NS, A ns1, A www, CNAME web→www, MX 10 mail + A mail 192.168.22.20, TXT SPF, TTL 86400.`,[[10,'A ns1 → 192.168.22.2','ns1 IN A 192.168.22.2',c=>c.h('A','ns1',e('192.168.22.2'))],[10,'A www → 192.168.22.10','www IN A 192.168.22.10',c=>c.h('A','www',e('192.168.22.10'))],[10,'CNAME web → www','web IN CNAME www',c=>c.h('CNAME','web',e('www.'+Z+'.'))],[10,'MX priority 10 → mail',`@ IN MX 10 mail.${Z}.`,c=>c.h('MX','@',e('10 mail.'+Z+'.'))],[8,'A mail','mail IN A 192.168.22.20',c=>c.h('A','mail',e('192.168.22.20'))],[8,'TXT SPF','@ IN TXT "v=spf1 mx -all"',c=>c.h('TXT','@',/^"v=spf1/i)]],'Pastikan target NS/MX/CNAME punya record A dan semua FQDN berakhiran titik.',ZH+`www IN A 192.168.22.10\nweb IN CNAME www\n@ IN MX 10 mail\nmail IN A 192.168.22.20\n@ IN TXT "v=spf1 mx -all"\n`,Z,'; DNS Challenge — ketik semua dari nol\n'),

 let o='',i=0,m;while(m=re.exec(t)){o+=esc(t.slice(i,m.index));const k=m[1]?'cm':m[2]?'sg':m[3]?'nu':'kw';o+=`<span class=${k}>${esc(m[0])}</span>`;i=re.lastIndex;if(!m[0])re.lastIndex++}
 return o+esc(t.slice(i))+'\n'}

 ta.addEventListener('input',sy);ta.addEventListener('scroll',()=>{hl.scrollTop=ta.scrollTop;hl.scrollLeft=ta.scrollLeft;g.scrollTop=ta.scrollTop});

  else if(ev.key=='Enter'){ev.preventDefault();const p=ta.selectionStart,b=ta.value.slice(0,p),ln=b.slice(b.lastIndexOf('\n')+1),ws=ln.match(/^\s*/)[0]+(/[{(]\s*$/.test(ln)?'  ':'');ta.setRangeText('\n'+ws,p,ta.selectionEnd,'end');sy()}});sy()}

const sha256=(()=>{const P=[];for(let n=2;P.length<64;n++)if(P.every(p=>n%p))P.push(n);const fr=x=>Math.floor((x-Math.floor(x))*4294967296),K=P.map(p=>fr(Math.cbrt(p))),H0=P.slice(0,8).map(p=>fr(Math.sqrt(p)));

  const H=H0.slice(),w=new Uint32Array(64);
  for(let o=0;o<b.length;o+=64){for(let i=0;i<16;i++)w[i]=(b[o+4*i]<<24|b[o+4*i+1]<<16|b[o+4*i+2]<<8|b[o+4*i+3])>>>0;
   for(let i=16;i<64;i++){const a=w[i-15],c=w[i-2],s0=((a>>>7|a<<25)^(a>>>18|a<<14)^(a>>>3))>>>0,s1=((c>>>17|c<<15)^(c>>>19|c<<13)^(c>>>10))>>>0;w[i]=(w[i-16]+s0+w[i-7]+s1)>>>0}
   let[a,b2,c,d,e,f,g,h]=H;
   for(let i=0;i<64;i++){const S1=((e>>>6|e<<26)^(e>>>11|e<<21)^(e>>>25|e<<7))>>>0,ch=((e&f)^(~e&g))>>>0,t1=(h+S1+ch+K[i]+w[i])>>>0,S0=((a>>>2|a<<30)^(a>>>13|a<<19)^(a>>>22|a<<10))>>>0,mj=((a&b2)^(a&c)^(b2&c))>>>0,t2=(S0+mj)>>>0;h=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b2;b2=a;a=(t1+t2)>>>0}
   [a,b2,c,d,e,f,g,h].forEach((v,i)=>H[i]=(H[i]+v)>>>0)}
  return H.map(v=>v.toString(16).padStart(8,'0')).join('')}})();
